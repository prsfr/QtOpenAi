name: CI

# One run per commit, and the split is what makes it one.
#
# `push` on every branch plus `pull_request` fires *both* events for a push to a
# branch with an open PR, so the same SHA was queued twice. A concurrency group
# naming the same thing under both events did dedupe it -- but by cancelling,
# and a cancelled run is a run that stays in the checks list looking like a
# failure. Twenty-one of them had piled up on one pull request against nine
# successes and not a single genuine failure.
#
# So the duplicate is no longer started. A branch under review is covered by
# `pull_request`; the default branch, which has no pull request, by `push`. The
# two sets do not overlap.
#
# The trade: a branch pushed with no pull request open gets no CI. That is the
# deliberate part -- open the pull request, which is where the result would be
# read anyway, or use "Run workflow".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: "Build and test on macOS and Windows as well as Linux"
        type: boolean
        default: false

# With one event per branch there is nothing left to reconcile, so the group is
# just the ref. Superseding still applies to a pull request -- a commit nobody
# is going to look at any more need not finish building -- but never to the
# default branch, where every commit is built so that a break can be pinned to
# the commit that caused it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      # The same script a contributor runs before pushing -- see the comment in
      # it for why the file list is not just `git ls-files`. Keeping the command
      # in one place is the point: when it lived here, the local version of it
      # was free to drift, and did.
      - name: Check formatting
        run: scripts/check-format.sh

  # Which platforms build-and-test runs on. Until 1.0 that is Linux only: this
  # is a Qt library with no platform-specific code, so macOS and Windows were
  # re-proving the same result at roughly twice the wall-clock of the Linux job.
  # Turn the other two back on without editing this file, either way:
  #
  #   * repository variable CI_ALL_PLATFORMS = true  -- for every run
  #   * "Run workflow" with "all_platforms" ticked   -- for one run
  #
  # Restoring all platforms unconditionally is tracked in #92 (for 1.0).
  platforms:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select platforms
        id: select
        env:
          # Linux and macOS build against Qt 6.11.1. Windows uses 6.10.3 because
          # download.qt.io serves no retrievable checksum for the entire Qt 6.11
          # Windows series (qt6_6110 and qt6_6111 Updates.xml), so aqtinstall
          # cannot install any 6.11 patch there ("Failed to locate XML data").
          # That is an upstream packaging gap; the library supports Qt 6.4+, so
          # the compiler coverage holds either way.
          LINUX_ONLY: >-
            {"include":[{"os":"ubuntu-latest","qt_version":"6.11.1"}]}
          ALL: >-
            {"include":[{"os":"ubuntu-latest","qt_version":"6.11.1"},
            {"os":"macos-latest","qt_version":"6.11.1"},
            {"os":"windows-latest","qt_version":"6.10.3"}]}
          REQUESTED: ${{ inputs.all_platforms || vars.CI_ALL_PLATFORMS }}
        run: |
          if [ "$REQUESTED" = "true" ]; then
            echo "matrix=$(echo "$ALL" | tr -d ' \n')" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(echo "$LINUX_ONLY" | tr -d ' \n')" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: ${{ matrix.os }} / Qt ${{ matrix.qt_version }}
    needs: platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt ${{ matrix.qt_version }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          # QtOpenAi::Realtime needs Qt6::WebSockets, which is not part of the
          # default install set. Without it that module is skipped silently.
          modules: qtwebsockets
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DQTOPENAI_BUILD_TESTS=ON
          -DQTOPENAI_BUILD_EXAMPLES=ON

      # `--parallel` without a number becomes `make -j` with no argument on the
      # Makefiles generator, which is *unbounded*: every ready target compiles
      # at once. Each tests/client TU pulls in Client.h with its ~70 reply
      # headers, so ~35 concurrent Release compiles exhausted the runner's
      # memory and the OOM killer took the runner agent with it (exit 143,
      # "runner has received a shutdown signal"). Locally this never showed:
      # Ninja's own default is bounded. Pin it to the runner's core count.
      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        working-directory: build
        run: ctest --build-config Release --output-on-failure

      # The configure step already refuses a GUI module named in any target's
      # link libraries. This is the other half: what the linker actually
      # recorded, so a GUI dependency arriving *transitively* -- through a
      # dependency of a dependency, where no CMakeLists mentions it -- is caught
      # too. A headless library that turns out to need a display stack at
      # runtime is discovered on the deployment, not in review.
      - name: No GUI dependency
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          found=0
          for lib in build/lib/libQtOpenAi*.so.*; do
            offenders=$(objdump -p "$lib" | awk '/NEEDED/ {print $2}' \
              | grep -E 'libQt6(Gui|Widgets|Quick|Qml|OpenGL|Charts|Svg|PrintSupport)' || true)
            if [ -n "$offenders" ]; then
              echo "::error::$(basename "$lib") needs $(echo $offenders | tr '\n' ' ')"
              found=1
            fi
          done
          if [ "$found" -ne 0 ]; then
            echo "QtOpenAi is a headless library; no module may depend on a GUI stack."
            exit 1
          fi
          echo "No QtOpenAi module depends on a GUI stack."

  install-consumer:
    name: find_package smoke test (${{ matrix.link }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        link: [shared, static]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          # qtwebsockets for QtOpenAi::Realtime. The rest are for the GUI
          # consumer below: the library must not depend on them, and must still
          # work when the application does.
          modules: qtwebsockets
          cache: true

      - name: Build & install QtOpenAi
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=$PWD/_prefix
          -DQTOPENAI_BUILD_TESTS=OFF
          -DQTOPENAI_BUILD_EXAMPLES=OFF
          -DQTOPENAI_BUILD_SHARED=${{ matrix.link == 'shared' && 'ON' || 'OFF' }} &&
          cmake --build build --parallel 4 &&
          cmake --install build

      - name: Configure, build & run the consumer
        run: >
          cmake -S tests/package -B build-consumer
          -DCMAKE_PREFIX_PATH=$PWD/_prefix &&
          cmake --build build-consumer &&
          LD_LIBRARY_PATH="$PWD/_prefix/lib:$QT_ROOT_DIR/lib" ./build-consumer/consumer

      # The converse of the "No GUI dependency" check. That one proves the
      # library needs no display stack; this one proves it still works inside an
      # application that has one, which is where most callers will be. Built
      # only when Qt6::Widgets is part of the install -- its absence is the
      # normal headless case, not a failure.
      - name: Run the GUI consumer
        if: hashFiles('build-consumer/gui_consumer') != ''
        env:
          QT_QPA_PLATFORM: offscreen
        run: LD_LIBRARY_PATH="$PWD/_prefix/lib:$QT_ROOT_DIR/lib" ./build-consumer/gui_consumer
