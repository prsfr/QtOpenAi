name: CI

# One run per commit, and the split is what makes it one.
#
# `push` on every branch plus `pull_request` fires *both* events for a push to a
# branch with an open PR, so the same SHA was queued twice. A concurrency group
# naming the same thing under both events did dedupe it -- but by cancelling,
# and a cancelled run is a run that stays in the checks list looking like a
# failure. Twenty-one of them had piled up on one pull request against nine
# successes and not a single genuine failure.
#
# So the duplicate is no longer started. A branch under review is covered by
# `pull_request`; the default branch, which has no pull request, by `push`. The
# two sets do not overlap.
#
# The trade: a branch pushed with no pull request open gets no CI. That is the
# deliberate part -- open the pull request, which is where the result would be
# read anyway, or use "Run workflow".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job only reads the repository (checkout, Qt from its own cache).
permissions:
  contents: read

# With one event per branch there is nothing left to reconcile, so the group is
# just the ref. Superseding still applies to a pull request -- a commit nobody
# is going to look at any more need not finish building -- but never to the
# default branch, where every commit is built so that a break can be pinned to
# the commit that caused it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      # The same script a contributor runs before pushing (AGENTS.md, #171).
      # Keeping the command in one place is the point: when it lived here, the
      # local version of it was free to drift, and did (#115). --strict makes a
      # missing clang-format a failure instead of a skip.
      - name: Check formatting
        run: scripts/check.sh --strict format

      # Plain greps over examples/, no build needed (#175).
      - name: Check examples
        run: scripts/check.sh --strict examples

      # jscpd against the committed baseline, no build needed (#182). The
      # image's node and npm install the pinned version; a registry outage is
      # a failure, not a skip.
      - name: Check duplication
        run: scripts/check.sh --strict duplication

  build-and-test:
    name: ${{ matrix.os }} / Qt ${{ matrix.qt_version }}
    runs-on: ${{ matrix.os }}
    # All three platforms on every run, unconditionally (#92). Until 1.0 this was
    # Linux only behind an opt-in switch; a release must not depend on someone
    # remembering to flip it, and the MSVC and Apple clang jobs are the ones that
    # catch template, constexpr and export-macro breakage.
    #
    # Pinned labels, not -latest (#206): Configure turns warnings into errors,
    # and a label that moves to a new image brings a new compiler, which would
    # turn main red with no change here. Moving a pin is a deliberate PR that
    # fixes what the newer compiler reports (scripts/check.sh warnings).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt_version: "6.11.1"
          - os: macos-15
            qt_version: "6.11.1"
          - os: windows-2025
            qt_version: "6.11.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt ${{ matrix.qt_version }}
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          # QtOpenAi::Realtime needs Qt6::WebSockets, which is not part of the
          # default install set. Without it that module is skipped silently.
          modules: qtwebsockets
          cache: true

      # From 6.11 download.qt.io splits the Windows repository by compiler, and
      # aqtinstall 3.3.0 -- which install-qt-action runs -- still looks in the
      # old place ("Failed to locate XML data", #33). scripts/ci/install-qt.py
      # is aqtinstall pointed at the new directory, checksums and all. Go back
      # to the step above once an aqtinstall release knows the layout.
      - name: Install Qt ${{ matrix.qt_version }} (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # The same py7zr install-qt-action pins. 1.1.3's stricter path check
          # rejects lib/cmake/Qt6/QtPublicSbomDocumentNamespaceHelpers.cmake
          # in the 6.11 qtbase archive ("Specified path is bad").
          python -m pip install --quiet "aqtinstall==3.3.0" "py7zr==1.1.0"
          python scripts/ci/install-qt.py install-qt windows desktop "${{ matrix.qt_version }}" \
            win64_msvc2022_64 --outputdir "$RUNNER_TEMP/Qt" --modules qtwebsockets
          root=$(cygpath -m "$RUNNER_TEMP/Qt/${{ matrix.qt_version }}/msvc2022_64")
          test -f "$root/lib/cmake/Qt6WebSockets/Qt6WebSocketsConfig.cmake"
          echo "QT_ROOT_DIR=$root" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$root" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"

      # The macos-15 label changes its default Xcode, and so Apple Clang, under
      # the warning gate. 16.4 was the image's default when this was pinned;
      # moving it is a deliberate PR. Before Configure, which resolves the SDK.
      - name: Select Xcode
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      # Warnings are errors here, and only here, on the pinned compilers above
      # (#206): a local build prints them and fails nothing.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DQTOPENAI_BUILD_TESTS=ON
          -DQTOPENAI_BUILD_EXAMPLES=ON
          -DQTOPENAI_WARNINGS_AS_ERRORS=ON

      # `--parallel` without a number becomes `make -j` with no argument on the
      # Makefiles generator, which is *unbounded*: every ready target compiles
      # at once. Each tests/client TU pulls in Client.h with its ~70 reply
      # headers, so ~35 concurrent Release compiles exhausted the runner's
      # memory and the OOM killer took the runner agent with it (exit 143,
      # "runner has received a shutdown signal"). Locally this never showed:
      # Ninja's own default is bounded. Pin it to the runner's core count.
      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        working-directory: build
        run: ctest --build-config Release --output-on-failure

      # The linker's view of the headless promise: no QtOpenAi library may
      # record a GUI library as NEEDED. The rationale lives in the check itself,
      # scripts/checks/40-headless.sh. Then the gate's own setup, and every
      # installed header compiled alone -- with -Werror, as this tree has it.
      - name: No GUI dependency, warning gate, headers
        if: runner.os == 'Linux'
        run: scripts/check.sh --strict --build-dir build headless warnings headers

  install-consumer:
    name: find_package smoke test (${{ matrix.link }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        link: [shared, static]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          # qtwebsockets for QtOpenAi::Realtime. The rest are for the GUI
          # consumer below: the library must not depend on them, and must still
          # work when the application does.
          modules: qtwebsockets
          cache: true

      # Installed with a deliberately non-default CMAKE_INSTALL_INCLUDEDIR. At
      # the default an exported include directory hardcoded to <prefix>/include
      # happens to be right, so the job could not tell whether the package
      # honours the variable -- and versioned or namespaced include directories
      # are routine for distribution packagers.
      #
      # CMAKE_INSTALL_LIBDIR is deliberately left alone: CMake only searches
      # <prefix>/lib64/cmake when FIND_LIBRARY_USE_LIB64_PATHS is set, which it
      # is not on Debian/Ubuntu multiarch, so overriding it here would make the
      # consumer fail to find the package at all rather than test anything.
      - name: Build & install QtOpenAi
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=$PWD/_prefix
          -DCMAKE_INSTALL_INCLUDEDIR=include/qtopenai-ci
          -DQTOPENAI_BUILD_TESTS=OFF
          -DQTOPENAI_BUILD_EXAMPLES=OFF
          -DQTOPENAI_BUILD_SHARED=${{ matrix.link == 'shared' && 'ON' || 'OFF' }} &&
          cmake --build build --parallel 4 &&
          cmake --install build

      - name: Configure, build & run the consumer
        run: >
          cmake -S tests/package -B build-consumer
          -DCMAKE_PREFIX_PATH=$PWD/_prefix &&
          cmake --build build-consumer &&
          LD_LIBRARY_PATH="$PWD/_prefix/lib:$QT_ROOT_DIR/lib" ./build-consumer/consumer

      # The converse of the "No GUI dependency" check. That one proves the
      # library needs no display stack; this one proves it still works inside an
      # application that has one, which is where most callers will be. Built
      # only when Qt6::Widgets is part of the install -- its absence is the
      # normal headless case, not a failure.
      - name: Run the GUI consumer
        if: hashFiles('build-consumer/gui_consumer') != ''
        env:
          QT_QPA_PLATFORM: offscreen
        run: LD_LIBRARY_PATH="$PWD/_prefix/lib:$QT_ROOT_DIR/lib" ./build-consumer/gui_consumer

  # The ways of building QtOpenAi that the shared test matrix does not cover
  # (#210): the whole suite against static libraries, QtOpenAi included from
  # source into another project, which must leave that project's build type
  # alone, and the whole suite under ASan/UBSan (#206). Linux only -- the first
  # two are platform-independent CMake, the subproject check skips on Windows,
  # which --strict would turn into a FAIL, and sanitize is Linux-only.
  build-variants:
    name: check ${{ matrix.check }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [static, subproject, sanitize]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          modules: qtwebsockets
          cache: true

      - name: scripts/check.sh ${{ matrix.check }}
        run: scripts/check.sh --strict --build-dir build ${{ matrix.check }}

  # The oldest Qt QtOpenAi supports, QTOPENAI_MIN_QT_VERSION, from the distro
  # (#205). A minimum no job builds against stops being true after a few
  # changes. The name follows QTOPENAI_MIN_QT_VERSION; qt-min fails if it does
  # not, and passes only when the tree really is that Qt.
  #
  # Pinned to ubuntu-24.04, whose Qt is 6.4.2: ubuntu-latest will move on to a
  # newer Qt and this job would quietly stop meaning anything. If 24.04 runners
  # are retired, install it with jurplel/install-qt-action instead
  # (version: 6.4.*, modules: qtwebsockets).
  qt-min:
    name: linux / Qt 6.4 (distro)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt from the distro
        run: >
          sudo apt-get update &&
          sudo apt-get install -y qt6-base-dev qt6-websockets-dev libqt6sql6-sqlite cmake ninja-build

      - name: scripts/check.sh against the minimum
        run: scripts/check.sh --strict --build-dir build build test headless headers qt-min subproject

      - name: Install, then build & run the package consumer
        run: >
          cmake --install build --prefix "$PWD/_prefix" &&
          cmake -S tests/package -B build-consumer -G Ninja -DCMAKE_PREFIX_PATH="$PWD/_prefix" &&
          cmake --build build-consumer &&
          LD_LIBRARY_PATH="$PWD/_prefix/lib" ./build-consumer/consumer

      - name: Run the GUI consumer
        if: hashFiles('build-consumer/gui_consumer') != ''
        env:
          QT_QPA_PLATFORM: offscreen
        run: LD_LIBRARY_PATH="$PWD/_prefix/lib" ./build-consumer/gui_consumer

  # Line, branch and function coverage of src/ against tests/coverage/ (#173).
  # The baseline holds for one compiler, gcovr and Qt -- Qt's macros expand
  # into src/ lines -- so this is the qt-min toolchain plus the distro gcovr,
  # not build-variants' Qt 6.11. Any drift in the three skips the check, which
  # --strict turns into a failure here.
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt and gcovr from the distro
        run: >
          sudo apt-get update &&
          sudo apt-get install -y qt6-base-dev qt6-websockets-dev libqt6sql6-sqlite cmake ninja-build gcovr

      - name: scripts/check.sh coverage
        run: scripts/check.sh --strict --build-dir build coverage

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build-coverage/coverage/

      - name: Coverage table in the job summary
        if: always()
        run: >
          if [ -f build-coverage/coverage/coverage.md ]; then
          cat build-coverage/coverage/coverage.md >> "$GITHUB_STEP_SUMMARY"; fi
